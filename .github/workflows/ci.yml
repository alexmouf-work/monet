name: CI

# Manual only (owner directive 2026-08-09: Actions storage is full).
#
# Nothing here deploys — deploys come from Vercel's Git integration — and the same gates run
# locally before every commit, so automatic runs bought little and cost storage on every push.
# `cache: npm` is deliberately absent: each run wrote a fresh multi-hundred-MB cache entry.
# Run it from the Actions tab when you want a clean-room check.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:vercel
      - run: npm test
      - run: npm run build
